name: 🤖 AI Browser Control

on:
  workflow_dispatch:
    inputs:
      task_script:
        description: 'Python task script (base64 encoded)'
        required: true

jobs:
  browser-task:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Playwright
        run: |
          pip install playwright pillow
          playwright install chromium
          playwright install-deps chromium

      - name: 📁 Create directories
        run: mkdir -p screenshots

      - name: 🎯 Decode and run task
        run: |
          echo "${{ github.event.inputs.task_script }}" | base64 -d > /tmp/task.py
          echo "=== Task Script ==="
          cat /tmp/task.py
          echo "==================="
          python /tmp/task.py

      - name: 📸 Upload Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: screenshots/
          retention-days: 1
